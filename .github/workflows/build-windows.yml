                '\treturn {\n\t\t.header = R"(\nvarying vec2 v_texcoord;\nuniform sampler2D y_texture;\n'
                'uniform sampler2D uv_texture;\n)",\n\t\t.body = R"(\n\tfloat y = texture2D(y_texture, v_texcoord).a '
