      - name: Patch lib_ui for Telegram 7.4.5 IV APIs (TonAddress, scroll_math, highlight rects, CustomEmoji texts).
        shell: bash
        run: |
          set -euo pipefail
          UI="$TBUILD/$REPO_NAME/Telegram/lib_ui"
          curl -fsSL "https://raw.githubusercontent.com/desktop-app/lib_ui/562381f7537c60a2bec7b0fea37bdb14392bfbf3/ui/widgets/scroll_math.h" -o "$UI/ui/widgets/scroll_math.h"
