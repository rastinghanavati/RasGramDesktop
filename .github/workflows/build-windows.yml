          #!/usr/bin/env python3
          """Patch AyuGram lib_ui (e3d0582) with the upstream Telegram 7.4.5 APIs it
          lacks, needed by the Instant View sources (td_iv): EntityType::TonAddress,
          ui/widgets/scroll_math.h, Ui::Text::String::countHighlightRects,
          CustomEmojiLinkTexts, TextParseKeepLeadingSpaces, ReplacedTextRanges and
          EntityReplacesText. Insertions only, except the ComputeScrollTo export.
          Every anchor must occur exactly once or the step fails. Files are
          normalized to LF line endings first: the Windows runner checks them out
          as CRLF, and the anchors use \n only."""
          import sys

          BASE = sys.argv[1]


          def patch(rel, old, new):
              path = BASE + '/' + rel
              with open(path, encoding='utf-8', newline='') as f:
                  text = f.read()
              crlf = text.count('\r')
              if crlf:
                  print('normalized ' + str(crlf)
                        + ' CR line endings in ' + rel)
              text = text.replace('\r\n', '\n').replace('\r', '\n')
              count = text.count(old)
              if count != 1:
                  print('FAIL: ' + rel + ': anchor found '
                        + str(count) + ' times (expected 1): ' + repr(old[:80]))
                  sys.exit(1)
              with open(path, 'w', encoding='utf-8', newline='') as f:
                  f.write(text.replace(old, new))
              print('patched ' + rel)


