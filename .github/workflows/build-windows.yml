                '\tif (!exact && toFrom >= current) {\n\t\tif (toTill < toFrom) {\n'
                '\t\t\ttoTill = toFrom;\n\t\t}\n\t\tif (toTill <= curBottom) {\n'
                '\t\t\treturn current;\n\t\t}\n\n\t\tscToFrom = toTill - size;\n'
                '\t\tif (scToFrom > toFrom) {\n\t\t\tscToFrom = toFrom;\n\t\t}\n'
                '\t\tif (scToFrom == current) {\n\t\t\treturn current;\n\t\t}\n'
                '\t} else {\n\t\tscToFrom = toFrom;\n\t}\n\treturn scToFrom;\n'
