          #!/usr/bin/env python3
          """Patch AyuGram lib_ui (e3d0582) with the upstream Telegram 7.4.5 APIs it
          lacks, needed by the main Telegram 7.4.5 sources: RpWidget accessibility
          (accessibilityChildRoleAt, accessibilityChildSelectionChanged,
          accessibilityChildShowMenu), ElasticScroll touch scrolling
          (touchScrollBy/Release/Finish, WheelSource, absorbBottomOverscroll),
          Ui::GL NV12 helpers (TwoComponentTextureFormat, FragmentSampleNV12Texture
          with chroma format), Ui::Platform system commands and native maximized
          state, Images::IsSvgFormat, Ui::GenericBox::setMinimalTopSkip, and the
          new ui/wrap/vertical_blocks files plus the reworked
          ui/basic_click_handlers files (SuspiciousRanges). Insertions only,
          except the ElasticScroll wheel-event rework, the GL shader block, and
          the ComputeScrollTo removal (now in scroll_math.h via the IV step).
          Every anchor must occur exactly once or the step fails. Files are
          normalized to LF line endings first: the Windows runner checks them
          out as CRLF, and the anchors use \n only."""
          import sys

          BASE = sys.argv[1]


          def patch(rel, old, new):
              path = BASE + '/' + rel
              with open(path, encoding='utf-8', newline='') as f:
                  text = f.read()
              crlf = text.count('\r')
              if crlf:
                  print('normalized ' + str(crlf)
                        + ' CR line endings in ' + rel)
              text = text.replace('\r\n', '\n').replace('\r', '\n')
              count = text.count(old)
              if count != 1:
                  print('FAIL: ' + rel + ': anchor found '
                        + str(count) + ' times (expected 1): ' + repr(old[:80]))
                  sys.exit(1)
              with open(path, 'w', encoding='utf-8', newline='') as f:
                  f.write(text.replace(old, new))
              print('patched ' + rel)


